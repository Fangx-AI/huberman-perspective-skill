[project]
name = "huberman-perspective-skill"
version = "0.21.0"
description = "Chinese health-guidance Skill that turns Huberman Lab frameworks and independent evidence into practical lifestyle actions"
requires-python = ">=3.11"
dependencies = [
  "lxml==6.0.2",
]

[tool.unittest]
start-directory = "tests"

[tool.release]
raw-cache-policy = "local-only"
invocation-policy = "automatic-for-lifestyle-guidance"
