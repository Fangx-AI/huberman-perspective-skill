name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --requirement requirements.lock
      - run: python scripts/release_check.py
      - run: python scripts/release_readiness.py
      - run: python scripts/quality_check.py SKILL.md
      - run: python scripts/evaluate_routing.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: python scripts/install_skill.py --destination .tmp-install/huberman-perspective
      - run: test -f .tmp-install/huberman-perspective/SKILL.md
